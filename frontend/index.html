<!DOCTYPE html>
<!-- 銅鑼タイマー／HTML本体  [GONG5-HTML-000]
     スマホ → Tailscale Funnel → NAS(Node.js/Express) → MQTT/TLS → ESP32 → サーボ → 銅鑼
     同じフォルダに style.css と app.js を置いてください -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#191512">
<title>銅鑼タイマー</title>

<!-- 書体（ネットに出られない場合は端末の明朝・ゴシックに自動で切り替わります）  [GONG5-HTML-001] -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- 上部：題字と接続表示  [GONG5-HTML-002] -->
<header class="top">
  <span class="title">銅鑼</span>
  <span class="grow"></span>
  <span class="pill" id="link" data-s="idle"><span class="dot"></span><span id="linkText">確認中</span></span>
</header>

<!-- 銅鑼：0秒で鳴る／タップで音を試せる  [GONG5-HTML-003] -->
<div class="holder" id="holder">
  <span class="ripple"></span><span class="ripple"></span><span class="ripple"></span>
  <button class="gong" id="gong" type="button" aria-label="音を試す"><b>鳴</b></button>
</div>

<!-- 残り時間：サーバーが持っている値を表示  [GONG5-HTML-004] -->
<div class="count" id="remaining">00:00</div>
<div class="state" id="status">待機中</div>

<!-- 時間の設定と操作  [GONG5-HTML-005] -->
<main class="panel">
  <div class="picker">
    <div class="pick"><label for="minutes">ふん</label><select id="minutes"></select></div>
    <span class="unit">分</span>
    <div class="pick"><label for="seconds">びょう</label><select id="seconds"></select></div>
    <span class="unit">秒</span>
  </div>

  <div class="actions">
    <button class="btn start" id="startButton" type="button">START</button>
    <button class="btn cancel" id="cancelButton" type="button" disabled>取消</button>
  </div>

  <p class="note">取消を押すと、送った命令をサーバー側で打ち消します。</p>
</main>

<script src="./app.js"></script>
</body>
</html>
